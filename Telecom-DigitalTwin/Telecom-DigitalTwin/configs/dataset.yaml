# ==========================================================
# Config Dataset - ảnh drone + camera pose + target novel views
# ==========================================================

dataset:
  data_root: "./data/bts_scene_01"      # thư mục chứa images/ + poses (COLMAP hoặc transforms.json)
  format: "colmap"                       # "colmap" | "nerf_transforms"
  images_dir: "images"
  eval_split_ratio: 0.1                  # tỉ lệ ảnh dùng để validation (llff-style: 1/8)
  resolution: -1                         # -1 = giữ nguyên độ phân giải gốc, hoặc downscale factor (1,2,4,8)
  white_background: false
  target_views_file: "target_poses.json" # 20-50 pose mục tiêu cần render (novel views) do đề bài cung cấp

preprocessing:
  run_colmap: false            # true nếu chưa có sparse reconstruction, sẽ tự chạy COLMAP SfM
  colmap_executable: "colmap"
  camera_model: "PINHOLE"
  init_pointcloud_from: "sparse"   # "sparse" (SfM points) | "random"
  num_random_points: 100000
  normalize_scene: true             # đưa scene về tâm (0,0,0) và scale chuẩn
