# ==========================================================
# Config Gaussian Model
# ==========================================================

model:
  sh_degree: 3                      # bậc Spherical Harmonics tối đa cho màu view-dependent
  percent_dense: 0.01                # ngưỡng % scene extent để clone/split gaussian

densify:
  densify_from_iter: 500
  densify_until_iter: 15000
  densification_interval: 100
  densify_grad_threshold: 0.0002
  opacity_reset_interval: 3000
  min_opacity: 0.005
  max_screen_size: 20
  max_world_size_ratio: 0.1          # so với scene extent
