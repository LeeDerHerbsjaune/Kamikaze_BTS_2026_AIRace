# ==========================================================
# Config gốc - Telecom Digital Twin (BTS 3D Reconstruction)
# Gộp tất cả config con trong cùng thư mục configs/.
# Sửa từng phần thì sửa trực tiếp trong file con tương ứng,
# không cần đụng vào file này.
# ==========================================================

experiment_name: "bts_scene_01"
seed: 42
device: "cuda"

# Thứ tự include quan trọng nếu có key trùng nhau (file sau đè file trước).
include:
  - dataset.yaml       # dataset + preprocessing
  - gaussian.yaml       # model
  - renderer.yaml        # renderer
  - loss.yaml              # loss + evaluation
  - train.yaml              # optimizer + training + densify/pruning
  - inference.yaml          # inference
