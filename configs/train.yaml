# ==========================================================
# Training Configuration
# ==========================================================

training:

  iterations: 50000

  log_interval: 50

  eval_interval: 2000

  save_interval: 5000

  checkpoint:

    directory: "./outputs/bts_scene_01/checkpoints"

# ==========================================================
# Optimizer
# ==========================================================

optimizer:

  position:

    lr_init: 0.00016
    lr_final: 0.0000016
    lr_delay_mult: 0.01
    lr_max_steps: 30000

  feature:

    lr: 0.0025

  opacity:

    lr: 0.05

  scaling:

    lr: 0.005

  rotation:

    lr: 0.001

# ==========================================================
# Spherical Harmonics
# ==========================================================

sh:

  increase_interval: 1000

# ==========================================================
# Gaussian Densification
# ==========================================================

densify:

  enabled: true

  from_iter: 500

  until_iter: 20000

  interval: 100

  grad_threshold: 0.0002

  clone_factor: 2
  split_factor: 2
  min_world_size_ratio: 0.00001
  # Trần an toàn cho tổng số Gaussian. Để null = không giới hạn (mặc định
  # gốc), nhưng trên GPU VRAM hạn chế (Kaggle T4/P100 ~16GB), số Gaussian có
  # thể tăng không kiểm soát qua densify (clone+split) tới khi CUDA OOM giữa
  # chừng training, MẤT HẾT tiến trình đã chạy. Đặt 1 con số cụ thể (vd
  # 400000) để Trainer tự loại bớt Gaussian opacity thấp nhất khi vượt trần,
  # thay vì để crash. 400000 chỉ là điểm khởi đầu - không phải con số đảm
  # bảo an toàn tuyệt đối (còn phụ thuộc dataset.images.resolution, số ảnh,
  # sh_degree...); tăng/giảm dựa trên VRAM còn trống thực tế bạn quan sát
  # được qua nvidia-smi trong lúc train.
  max_gaussians: 2000000

  # Trần tỉ lệ (trục dài nhất / trục ngắn nhất) cho phép trên mỗi Gaussian.
  # Nếu không giới hạn, optimizer có thể kéo 1 Gaussian thành hình "kim" cực
  # mỏng (vd scale [10, 0.001, 0.001]) - từ 1 vài góc nhìn nhất định, quả
  # kim này chiếu lên màn hình thành vệt sọc dài sáng/xám bất thường (đúng
  # kiểu artifact "vệt sọc" hay gặp ở target novel view, vì góc nhìn đó khác
  # hẳn các train view mà optimizer đã quen). Sau MỖI optimizer.step(), kéo
  # trục ngắn nhất lên tối thiểu bằng `trục dài nhất / max_anisotropy` -
  # KHÔNG bao giờ đụng tới trục dài nhất, chỉ ngăn trục ngắn co lại quá mức.
  # Để null hoặc 0 để tắt (không giới hạn, giống 3DGS gốc).
  max_anisotropy: 6.0

  # Trần tỉ lệ (so với bán kính scene) cho MỖI trục scale, áp dụng CHỦ ĐỘNG
  # mỗi iteration (không chỉ lúc densify) - nhắm vào artifact "Smearing"
  # (Gaussian quá khổ + opacity cao che phủ 1 vùng ảnh rộng, làm nhòe chi
  # tiết). Dùng chung ngưỡng với pruning.size.max_world_ratio bên dưới (prune
  # là lưới an toàn cuối, clamp này chủ động nắn liên tục giữa các lần
  # densify). Để null/0 để tắt.
  max_scale_ratio: 0.06

# ==========================================================
# Gaussian Pruning
# ==========================================================

pruning:

  opacity:

    min: 0.015

    reset_interval: 3000

  size:

    max_screen: 20

    max_world_ratio: 0.06

  # Trần khoảng cách (tính theo bội số bán kính scene đã normalize) từ tâm
  # scene - nhắm vào artifact "Background collapse"/"Floating Gaussian"
  # vùng trời: Gaussian ở đó thường VẪN được nhìn thấy ở nhiều ảnh train
  # (bầu trời chiếm phần lớn khung hình các ảnh chếch lên), nên
  # min_visible_count bên dưới KHÔNG bắt được chúng - cần tiêu chí độc lập
  # dựa trên vị trí bất thường thay vì tần suất nhìn thấy. Để null để tắt.
  # CẢNH BÁO (từ 1 sự cố thật): "extent" ở đây là bán kính QUỸ ĐẠO CAMERA
  # (drone bay quanh trạm), KHÔNG phải bán kính công trình thật. Với dữ liệu
  # drone/aerial, 2 cái này có thể lệch nhau nhiều - drone bay vòng bán kính
  # hẹp nhưng chụp xuống 1 công trình có chân đế rộng hơn hẳn quỹ đạo bay.
  # Nếu để quá thấp, tiêu chí này xoá luôn cả hình học THẬT (không chỉ
  # floater vùng trời) - đã từng gây sập toàn bộ Gaussian về 0 (192304 -> 0
  # ngay lần prune đầu tiên ở iter 600), kéo theo crash SIGFPE native trong
  # gsplat ở lần render kế tiếp. Đã nới từ giá trị cũ gây sự cố lên 6.0 -
  # theo dõi log dòng "[prune WARNING]"/"[prune breakdown]" khi train để
  # biết % Gaussian bị tiêu chí này đánh dấu; nếu vẫn thấy > 20-30% dù đã
  # nới, cân nhắc set null để tắt hẳn thay vì dò tiếp.
  max_distance_from_center: 6.0

  # Trần an toàn tuyệt đối: KHÔNG BAO GIỜ để 1 lần prune xoá xuống dưới mức
  # này (xem _prune_points() trong trainer.py) - phòng trường hợp 1 tiêu chí
  # prune nào đó (vd max_distance_from_center ở trên) bị cấu hình sai và xoá
  # gần hết/toàn bộ Gaussian, dẫn tới lần render kế tiếp crash cứng
  # (SIGFPE native trong gsplat, không phải lỗi Python bắt được).
  min_gaussians_floor: 1000

  schedule:

    # Prune nhẹ theo lịch riêng, độc lập với chu kỳ densify chính.
    # Mặc định dùng lại from_iter/interval của densify nếu để null.
    after_iter: null
    interval: null
    # QUAN TRỌNG: để null ở đây sẽ TẮT HẲN visibility-based pruning (nhắm
    # vào "Floating Gaussian") dù code có default=3 - vì key này TỒN TẠI
    # trong yaml (giá trị None), cfg_get() sẽ dùng giá trị None đó thay vì
    # default trong code. Phải set rõ ràng 1 con số ở đây nếu muốn bật.
    min_visible_count: 5