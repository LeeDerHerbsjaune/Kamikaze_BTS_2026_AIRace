# ==========================================================
# Inference Configuration
# ==========================================================

inference:

  checkpoint: "./outputs/bts_scene_01/checkpoints/last.pth"

  output:
    directory: "./outputs/bts_scene_01/novel_views"

    # Zips every rendered .png into a single archive (placed next to
    # `directory`, i.e. one level up) right after rendering - ready to
    # upload as-is. Off by default so existing behavior is unchanged.
    zip: false
    zip_name: "submission.zip"

  render:

    images: true

    video:
      enabled: true
      fps: 24
      codec: "mp4"
